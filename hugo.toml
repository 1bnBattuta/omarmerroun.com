      			subtitle = "Notes on Linux systems, kernel internals, and things I'm learning."
      			owner = { name = "Omar Merroun", email = "omar@omarmerroun.com" }
      			keywords = ""
      			copyright = ""
      			menuMore = "Show more"
      			readMore = "Read more"
      			readOtherPosts = "Read other posts"
      			newerPosts = "Newer posts"
      			olderPosts = "Older posts"
      			missingContentMessage = "Page not found..."
      			missingBackButtonLabel = "Back to home page"

      			[languages.en.params.logo]
        			logoText = "omarmerroun"
        			logoHomeLink = "/"

		[[languages.en.menu.main]]
      			identifier = "about"
      			name = "about"
      			url = "/about"
