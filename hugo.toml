baseURL = 'https://omarmerroun.com/'
languageCode = 'en-us'
title = 'Omar Merroun'
theme = 'terminal'
paginate = 10

[params]
	contentTypeName = "posts"
	themeColor = "orange"
	showMenuItems = "2"
	fullWidthTheme = false
	centerTheme = true
	autoCover = true
	showLastUpdated = false
	
[params.twitter]


[languages]
	[languages.en]
		languageName = "English"
   		title = "Omar Merroun"
		copyright = "© 2026 Omar Merroun · Content CC BY 4.0 · Code MIT · RSS"
